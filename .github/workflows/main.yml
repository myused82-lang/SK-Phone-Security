name: Build SK Phone Security APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          find . -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "SK_Phone_Security_Free_Project.zip" ]; then
            mkdir -p project
            unzip -o SK_Phone_Security_Free_Project.zip -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project files or project ZIP not found."
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Phone-Security-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
