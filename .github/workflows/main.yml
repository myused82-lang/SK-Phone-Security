name: Build SK Phone Security APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -o SK_Phone_Security_Free_Project.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Phone-Security-APK
          path: project/**/build/outputs/apk/debug/*.apk
